<!-- Local verification harness for the ResetPassword screen.

     SAME BLOCK, FEWER ROWS. This mirrors Layout_Login's DOM exactly as ODC
     renders it (b1- ids are block-owned, unprefixed ids are screen-owned)
     with the password group and the forgot row removed, which is the whole
     of what id.outsystems.com/community/resetpassword is.

     Serve the repo root and open it:

         python3 -m http.server 8777 --bind 127.0.0.1
         open http://127.0.0.1:8777/tools/resetpassword-harness.html

     The corner artwork stays blank here: its background urls are ODC
     authoring paths (/NeoDesignSystem/img/...) that only resolve after a
     publish rewrites them. Everything else is measurable.

     Toggle themes with data-theme="light|dark" on <html>. -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8">
<title>reset password harness</title>
<link rel="stylesheet" href="/dist/neobase.css">
<style>
  /* Stand in for ODC's shell: the 24px body grid and the screen container. */
  /* ODC's platform reset provides this; neobase.css does not, so the
     harness has to or every 40px control measures 42. */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Noto Sans",sans-serif;font-size:14px;line-height:24px;
       background:#F9FAFB;color:var(--text-primary)}
  :root[data-theme="dark"] body{background:#181A1F}
  .active-screen.screen-container{overflow-y:scroll;height:100vh}
</style></head>
<body>
<div class="active-screen screen-container">
<div class="pds-login" id="b1-LoginRoot">
  <span class="rectangles rectangle-top-left"></span>
  <span class="rectangles rectangle-top-right"></span>
  <span class="rectangles rectangle-bottom-left"></span>
  <span class="rectangles rectangle-bottom-right"></span>
  <div class="pds-login-right" id="b1-LoginRight">
    <div class="pds-login-right-form" id="b1-LoginRightForm">
      <div class="pds-login-right-logo" id="b1-LogoContainer"><div class="neo-ph" id="b1-Logo"></div></div>
      <div class="pds-login-right-account font-semi-bold" id="b1-TitleContainer">Forgot your password?</div>
      <!-- the Content placeholder: a bare div with no class -->
      <div>
        <div class="pds-login-right-inputs" id="EmailContainer">
          <label class="OSFillParent" for="EmailInput" id="EmailLabel">Email</label>
          <input id="EmailInput" class="form-control input-large OSFillParent" data-input type="text">
        </div>
        <div class="pds-login-right-button" id="ButtonContainer">
          <div class="OSBlockWidget">
            <div class="osui-btn-loading OSInline">
              <div class="OSBlockWidget"><button class="btn btn-primary btn-large">Reset password</button></div>
            </div>
          </div>
        </div>
      </div>
      <div class="pds-login-right-signup-account font-size-s text-align-left" id="b1-FooterContainer">Back to <a class="link-small" href="#">Log in</a></div>
    </div>
  </div>
</div>
</div>
</body></html>
